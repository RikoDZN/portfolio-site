<style>
html{scroll-behavior:smooth}
body{margin:0;background:#07060A}
a{color:inherit}
a:hover{color:inherit}
.v2{--bg:#07060A;--ink:#F4F1EA;--mut:#ABA7B5;--lab:#918D9E;--line:rgba(255,255,255,0.1);--glass:rgba(255,255,255,0.04);--ease:cubic-bezier(0.2,0.8,0.2,1);--mx:0;--my:0;position:relative;isolation:isolate;min-height:100vh;overflow-x:clip;background:var(--bg);color:var(--ink);font-family:Geist,system-ui,sans-serif;font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
.v2 *,.v2 *::before,.v2 *::after{box-sizing:border-box}
.v2 ::selection{background:var(--a);color:#07060A}
.wrap{width:100%;max-width:1440px;margin:0 auto;padding:0 clamp(18px,3vw,40px)}
.mono{font-family:'Geist Mono',ui-monospace,monospace;font-size:11.5px;font-weight:500;letter-spacing:0.14em;text-transform:uppercase}
.disp{font-family:Anybody,sans-serif}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ---------- atmosphere ---------- */
.aura{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.aura i{position:absolute;width:62vw;aspect-ratio:1;border-radius:50%}
.aura i:nth-child(1){left:-18vw;top:-20vw;background:radial-gradient(closest-side,color-mix(in srgb,var(--a) 13%,transparent),transparent);animation:au1 38s ease-in-out infinite alternate}
.aura i:nth-child(2){right:-24vw;top:30%;background:radial-gradient(closest-side,rgba(126,96,255,0.15),transparent);animation:au2 44s ease-in-out infinite alternate}
.aura i:nth-child(3){left:20vw;bottom:-34vw;background:radial-gradient(closest-side,rgba(255,120,80,0.09),transparent);animation:au3 52s ease-in-out infinite alternate}
@keyframes au1{to{transform:translate(22vw,26%) scale(1.1)}}
@keyframes au2{to{transform:translate(-20vw,18%) scale(0.92)}}
@keyframes au3{to{transform:translate(12vw,-30%) scale(1.08)}}
.grain{position:fixed;inset:0;width:100%;height:100%;z-index:80;pointer-events:none;opacity:0.045}
@media (max-height:1600px){.grain{inset:-6%;width:112%;height:112%;animation:grainJit 0.8s steps(1) infinite}}
@keyframes grainJit{0%{transform:translate(0,0)}12%{transform:translate(-3%,2%)}25%{transform:translate(2%,-3%)}37%{transform:translate(-2%,-1%)}50%{transform:translate(3%,3%)}62%{transform:translate(-3%,-3%)}75%{transform:translate(1%,2%)}87%{transform:translate(-1%,3%)}}

/* ---------- buttons + type ---------- */
.b{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 26px;border-radius:999px;border:1px solid transparent;font-family:Geist,sans-serif;font-weight:600;font-size:15px;line-height:1;text-decoration:none;cursor:pointer;transition:background 0.3s,color 0.3s,border-color 0.3s,box-shadow 0.3s,translate 0.35s var(--ease)}
.b svg{width:18px;height:18px;flex:none}
.b-a{background:var(--a);color:#07060A;box-shadow:0 12px 40px -14px color-mix(in srgb,var(--a) 75%,transparent)}
.b-a:hover{color:#07060A;box-shadow:0 16px 54px -10px var(--a)}
.b-g{background:rgba(255,255,255,0.06);color:var(--ink);border-color:rgba(255,255,255,0.18);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.b-g:hover{border-color:var(--ink)}
.b-xl{min-height:64px;padding:0 34px;font-size:17px}
.b:focus-visible{outline:2px solid var(--a);outline-offset:3px}
.mag{translate:var(--tx,0px) var(--ty,0px)}
.sec{position:relative;padding:clamp(96px,11vw,170px) 0}
.lab{margin:0 0 18px;color:var(--lab)}
.lab b{font-weight:500;color:var(--a)}
.h2{margin:0;font-family:Anybody,sans-serif;font-stretch:125%;font-weight:800;font-size:clamp(44px,7vw,112px);line-height:0.9;letter-spacing:-0.03em;color:var(--ink)}
.h2 em,.cta-h em,.stmt-t em,.cv-sub em{font-family:Fraunces,Georgia,serif;font-style:italic;font-weight:900;font-optical-sizing:auto;letter-spacing:-0.02em;color:var(--a)}
.af-classic :is(.h2,.cta-h,.stmt-t,.cv-sub) em{font-family:'Playfair Display',Georgia,serif;font-weight:900;letter-spacing:-0.01em}
.af-brush :is(.h2,.cta-h,.stmt-t,.cv-sub) em{font-family:'Kaushan Script',cursive;font-style:normal;font-weight:400;letter-spacing:0}
.v2 :is(.h2,.cta-h,.stmt-t,.cv-sub) em{padding:0 0.14em;margin:0 -0.14em;background-image:linear-gradient(100deg,var(--a) 0%,var(--a) 40%,color-mix(in srgb,var(--a) 28%,#FFFFFF) 50%,var(--a) 60%,var(--a) 100%);background-size:300% 100%;background-position:100% 0;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;text-shadow:none;animation:shine 7s ease-in-out 1.6s infinite}
.v2 :is(.h2,.cta-h,.stmt-t,.cv-sub) em::selection{-webkit-text-fill-color:#07060A}
.af-brush :is(.h2,.cta-h,.stmt-t,.cv-sub) em{padding:0 0.22em;margin:0 -0.22em;-webkit-text-stroke:0.028em var(--a)}
.af-brush :is(.h2,.cta-h) em{font-size:1.1em}
@keyframes shine{0%,55%{background-position:100% 0}90%,100%{background-position:0% 0}}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:24px 48px;margin-bottom:clamp(36px,5vw,64px)}
.note{margin:0;max-width:430px;color:var(--mut);font-size:16px}
.tl{color:var(--ink);text-decoration:underline;text-decoration-color:var(--a);text-decoration-thickness:1.5px;text-underline-offset:3px;transition:color 0.25s}
.tl:hover{color:var(--a)}

/* ---------- motion system: scroll reveals (the page script sets data-in) ---------- */
.w{display:inline-block;clip-path:inset(-0.12em -0.4em -0.26em -0.4em)}
.wi{display:inline-block}
.rv-t{position:relative;width:fit-content}
.v2.mo :is(.rv,.rv-h,.rv-t,.rv-i,.rv-s):not([data-in]),.v2.mo .rv-g:not([data-in]) > *{opacity:0}
.v2.mo .rv[data-in]{animation:rvUp 1.1s var(--ease) var(--d,0ms) backwards}
.v2.mo .rv-g[data-in] > *{animation:rvPop 0.9s var(--ease) var(--d,0ms) backwards}
.v2.mo .rv-h[data-in] .wi{animation:rvW 1.2s var(--ease) calc(var(--d,0ms) + var(--wi,0) * 85ms) backwards}
.v2.mo .rv-h[data-in] em.wi{animation:rvW 1.2s var(--ease) calc(var(--d,0ms) + var(--wi,0) * 85ms) backwards,shine 7s ease-in-out 1.6s infinite}
.v2.mo .rv-s[data-in]{animation:rvS 1.2s var(--ease) var(--d,0ms) backwards}
.v2.mo .rv-i[data-in]{animation:rvI 1.3s var(--ease) var(--d,0ms) backwards}
.v2.mo .rv-t[data-in]{clip-path:inset(-0.4em calc(100% - var(--tw) - 1em) -0.4em -0.4em);animation:rvT 0.9s steps(16,end) var(--d,0ms) backwards}
.v2.mo .rv-t[data-in]::after{content:"";position:absolute;top:0.05em;bottom:0.05em;left:calc(var(--tw) + 0.2em);width:0.62em;background:var(--a);opacity:0;pointer-events:none;animation:rvCaret 2s linear var(--d,0ms) both}
.rv-g > :nth-child(2){--d:70ms}.rv-g > :nth-child(3){--d:140ms}.rv-g > :nth-child(4){--d:210ms}.rv-g > :nth-child(5){--d:280ms}.rv-g > :nth-child(6){--d:350ms}.rv-g > :nth-child(7){--d:420ms}.rv-g > :nth-child(n+8){--d:490ms}
.lab + .rv-h,.lab + .stmt-w{--d:90ms}
.head .note.rv{--d:220ms}
@property --tw{syntax:'<percentage>';inherits:true;initial-value:100%}
@property --v{syntax:'<integer>';inherits:false;initial-value:0}
@keyframes rvUp{0%{opacity:0;transform:translateY(28px);filter:blur(10px);-webkit-mask-image:linear-gradient(100deg,#000 40%,transparent 60%);mask-image:linear-gradient(100deg,#000 40%,transparent 60%);-webkit-mask-size:280% 100%;mask-size:280% 100%;-webkit-mask-position:100% 0;mask-position:100% 0}100%{-webkit-mask-image:linear-gradient(100deg,#000 40%,transparent 60%);mask-image:linear-gradient(100deg,#000 40%,transparent 60%);-webkit-mask-size:280% 100%;mask-size:280% 100%;-webkit-mask-position:0 0;mask-position:0 0}}
@keyframes rvPop{from{opacity:0;transform:translateY(26px) scale(0.96);filter:blur(8px)}}
@keyframes rvW{from{transform:translateY(130%) rotate(7deg);filter:blur(5px)}}
@keyframes rvS{from{opacity:0;font-stretch:55%;letter-spacing:0.1em;filter:blur(8px)}}
@keyframes rvI{from{opacity:0;transform:translateY(46px);clip-path:inset(14% 8% 14% 8% round 28px)}to{clip-path:inset(0 0 0 0 round 18px)}}
@keyframes rvImg{from{scale:1.35;filter:blur(12px) brightness(0.55)}}
@keyframes rvT{from{--tw:0%}to{--tw:100%}}
@keyframes rvCaret{0%,56%{opacity:1}57%,68%{opacity:0}69%,80%{opacity:1}81%,100%{opacity:0}}
/* count-up numbers */
.cnt{--v:var(--to);counter-reset:v var(--v);font-variant-numeric:tabular-nums}
.cnt::after{content:attr(data-pre) counter(v)}
.v2.mo .rv-g[data-in] .cnt{animation:cntUp 1.9s cubic-bezier(0.16,1,0.3,1) calc(var(--d,0ms) + 120ms) backwards}
@keyframes cntUp{from{--v:0}}
/* idle: light sweep on accent buttons */
.b-a{position:relative;overflow:hidden;isolation:isolate}
.b-a::after{content:"";position:absolute;top:0;bottom:0;left:0;z-index:-1;width:60%;pointer-events:none;background:linear-gradient(100deg,transparent,rgba(255,255,255,0.7),transparent);transform:translateX(-160%) skewX(-18deg);animation:sheen 5.5s ease-in-out 2.2s infinite}
@keyframes sheen{0%,62%{transform:translateX(-160%) skewX(-18deg)}86%,100%{transform:translateX(260%) skewX(-18deg)}}
/* idle: floating embers */
.emb{position:absolute;inset:0;z-index:1;overflow:hidden;pointer-events:none}
.emb i{position:absolute;top:0;bottom:0;left:var(--x);width:var(--s);animation:emUp var(--t) linear var(--dl) infinite}
.emb i::before{content:"";position:absolute;left:0;top:100%;width:var(--s);height:var(--s);border-radius:50%;background:var(--a);box-shadow:0 0 8px var(--a),0 0 20px color-mix(in srgb,var(--a) 55%,transparent);opacity:0;animation:emSway calc(var(--t) / 3) ease-in-out var(--dl) infinite alternate,emFade var(--t) linear var(--dl) infinite}
@keyframes emUp{to{transform:translateY(-104%)}}
@keyframes emSway{to{translate:var(--dx) 0}}
@keyframes emFade{0%{opacity:0}12%,68%{opacity:var(--o,0.75)}100%{opacity:0}}

/* ---------- dynamic island nav ---------- */
.nav{position:sticky;top:0;z-index:60;height:0}
.isl{position:absolute;top:14px;left:0;right:0;margin:0 auto;width:980px;max-width:calc(100% - 24px);display:flex;flex-direction:column;border-radius:28px;overflow:hidden;background:rgba(8,8,12,0.6);border:1px solid rgba(255,255,255,0.12);-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);box-shadow:0 20px 60px -24px rgba(0,0,0,0.85),inset 0 1px 0 rgba(255,255,255,0.08);transition:width 0.65s cubic-bezier(0.34,1.36,0.64,1),background 0.4s ease,border-color 0.4s ease}
.isl-row{display:flex;align-items:center;justify-content:space-between;gap:14px;height:56px;padding:0 8px 0 20px;transition:height 0.5s cubic-bezier(0.34,1.36,0.64,1),padding 0.4s ease}
.isl-l{display:flex;align-items:center;gap:14px;min-width:0}
.brand{display:inline-flex;align-items:center;gap:10px;min-height:44px;text-decoration:none;font-family:Anybody,sans-serif;font-stretch:130%;font-weight:900;font-size:17px;letter-spacing:-0.01em;color:var(--ink)}
.brand-dot{width:10px;height:10px;flex:none;border-radius:50%;background:var(--a);box-shadow:0 0 14px var(--a)}
.links{display:flex;gap:2px}
.links a{display:inline-flex;align-items:center;min-height:40px;padding:0 13px;border-radius:999px;text-decoration:none;font-size:14px;font-weight:500;color:#DCD9E2;transition:background 0.25s,color 0.25s}
.links a:hover{background:rgba(255,255,255,0.1);color:#FFFFFF}
.links a{position:relative}
.links a::after{content:"";position:absolute;left:13px;right:13px;bottom:7px;height:1.5px;border-radius:2px;background:var(--a);transform:scaleX(0);transform-origin:100% 50%;transition:transform 0.45s var(--ease)}
.links a:hover::after{transform:scaleX(1);transform-origin:0 50%}
.isl{animation:islDrop 1.1s cubic-bezier(0.34,1.36,0.64,1) 0.25s backwards}
@keyframes islDrop{from{opacity:0;transform:translateY(-140%) scale(0.86)}}
.brand-dot{animation:dotPulse 2.8s ease-in-out infinite}
@keyframes dotPulse{50%{transform:scale(1.3);box-shadow:0 0 22px var(--a)}}
.isl-end{display:flex;align-items:center;gap:10px}
.isl-live{display:inline-flex;align-items:center;gap:8px;font-size:10.5px;color:#DCD9E2}
.isl-live i,.kick i{width:7px;height:7px;flex:none;border-radius:50%;background:#3DFF8F;box-shadow:0 0 10px #3DFF8F;animation:blink 2s ease-in-out infinite}
@keyframes blink{50%{opacity:0.35}}
.isl-cta{min-height:40px;padding:0 18px;font-size:14px}
.isl-now{display:none;align-items:center;gap:8px;font-size:10.5px;color:var(--ink);white-space:nowrap}
.isl-btn{display:none;flex-direction:column;align-items:center;justify-content:center;gap:5px;width:40px;height:40px;margin:0;padding:0;border:0;border-radius:50%;background:rgba(255,255,255,0.08);cursor:pointer}
.isl-btn span{display:block;width:16px;height:2px;border-radius:2px;background:var(--ink);transition:transform 0.35s var(--ease)}
.isl-btn:focus-visible{outline:2px solid var(--a);outline-offset:2px}
.isl-menu{display:none}
.isl-prog{position:absolute;left:24px;right:24px;bottom:0;height:2px;background:var(--a);transform-origin:left;transform:scaleX(0)}
@supports (animation-timeline: scroll()){.isl-prog{animation:prog linear both;animation-timeline:scroll(root)}}
@keyframes prog{to{transform:scaleX(1)}}
.nav.mini:not(.open) .isl:not(:hover):not(:focus-within){width:300px;background:rgba(0,0,0,0.92);border-color:rgba(255,255,255,0.08)}
.nav.mini:not(.open) .isl:not(:hover):not(:focus-within) .isl-row{height:46px;padding:0 16px}
.nav.mini:not(.open) .isl:not(:hover):not(:focus-within) :is(.links,.isl-cta,.brand-t){display:none}
.nav.mini:not(.open) .isl:not(:hover):not(:focus-within) .isl-now{display:inline-flex;animation:islIn 0.45s var(--ease) both}
.nav.mini .isl:is(:hover,:focus-within) :is(.links,.isl-end){animation:islIn 0.45s var(--ease) both}
@keyframes islIn{from{opacity:0;transform:scale(0.92)}}
.isl-link{display:flex;align-items:center;min-height:50px;padding:0 16px;border-radius:14px;font-family:Anybody,sans-serif;font-stretch:120%;font-weight:800;font-size:18px;text-decoration:none;color:var(--ink);background:rgba(255,255,255,0.05);transition:background 0.25s,color 0.25s}
.isl-link:hover{background:var(--a);color:#07060A}
.nav.open .isl{width:440px;border-radius:28px;background:rgba(10,9,14,0.94)}
.nav.open .isl-menu{display:grid;gap:6px;padding:4px 12px 16px;animation:islIn 0.4s var(--ease) both}
.nav.open .isl-btn span:first-child{transform:translateY(3.5px) rotate(45deg)}
.nav.open .isl-btn span:last-child{transform:translateY(-3.5px) rotate(-45deg)}
@media (max-width:980px){.links{display:none}.isl-btn{display:inline-flex}}
@media (max-width:560px){.isl-live{display:none}.isl-cta{padding:0 14px}}

/* ---------- hero: curved gallery ---------- */
.cv{--H:max(620px,56.25vw);position:relative;view-timeline-name:--cv}
@media (max-height:1600px){.cv{--H:max(560px,100vh);--H:max(560px,100svh)}}
.cv-stage{position:relative;height:var(--H);overflow:hidden;-webkit-user-select:none;user-select:none;background:radial-gradient(ellipse 80% 60% at 50% 60%,#17131F 0%,#0C0A11 48%,#07060A 80%)}
.cv-stage::before{content:"";position:absolute;left:50%;top:60%;width:min(1200px,92vw);height:52%;translate:-50% -50%;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--a) 10%,transparent),transparent);pointer-events:none}
.cv-gl{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:pan-y;-webkit-tap-highlight-color:transparent}
.cv-ui{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;padding:calc(var(--H) * 0.1 + 18px) 20px calc(var(--H) * 0.045 + 8px);text-align:center;pointer-events:none}
.cv-ui a{pointer-events:auto}
.cv-top,.cv-bot{display:flex;flex-direction:column;align-items:center;gap:14px}
.kick{display:inline-flex;align-items:center;gap:10px;margin:0;padding:9px 16px;border-radius:999px;border:1px solid rgba(255,255,255,0.14);background:rgba(10,9,14,0.62);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);font-size:11px;color:#E6E3EC}
.cv-h{margin:0;display:flex;flex-wrap:wrap;align-items:baseline;justify-content:center;font-family:Anybody,sans-serif;font-stretch:150%;font-weight:900;font-size:clamp(52px,min(10.4vw,calc(var(--H) * 0.17)),176px);line-height:0.82;letter-spacing:-0.035em;color:var(--ink);text-shadow:0 10px 60px rgba(0,0,0,0.6)}
.cv-h .o{color:transparent;-webkit-text-stroke:2px var(--ink);text-shadow:none}
.cv-sub{margin:0;max-width:640px;font-size:clamp(17px,1.5vw,21px);line-height:1.5;color:#E0DDE6;text-shadow:0 2px 20px rgba(0,0,0,0.8)}
.cv-sub em{font-size:1.2em;letter-spacing:0}
.cv-band{position:relative;flex:1 1 0;width:100%;min-height:110px;margin:clamp(14px,2vw,28px) 0}
.cv-fb{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:14px;overflow:hidden;visibility:hidden}
.cv.nogl .cv-fb{visibility:visible;pointer-events:auto}
.cv-t{flex:none;height:78%;aspect-ratio:16 / 9;margin:0;padding:0;border:0;border-radius:14px;overflow:hidden;background:#15131C;cursor:zoom-in;box-shadow:0 0 0 1px rgba(255,255,255,0.08)}
.cv-t img{display:block;width:100%;height:100%;object-fit:cover;pointer-events:none;-webkit-user-drag:none}
.cv-cta{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.cv-hint{margin:0;font-size:10.5px;color:#BDB9C7;visibility:hidden}
.cv.gl .cv-hint{visibility:visible}
.cv-hint .t{display:none}
@media (hover:none){.cv-hint .m{display:none}.cv-hint .t{display:inline}}
.cv-now{position:absolute;left:0;right:0;top:calc(50% + var(--bh,110px) + 14px);display:flex;justify-content:center;gap:10px;margin:0;font-size:10.5px;color:#CFCBD8;opacity:0;transition:opacity 0.5s}
.cv.gl .cv-now{opacity:1}
.cv-now b{font-weight:500;color:var(--a)}

.ps-k li.me{border-color:color-mix(in srgb,var(--a) 50%,transparent);color:var(--a)}
.ps-f{position:relative;margin:0;aspect-ratio:16 / 9;overflow:hidden;background:#15131C}
.ps-f img{display:block;width:100%;height:100%;object-fit:cover}
.ps-f figcaption{position:absolute;left:14px;bottom:14px;padding:6px 10px;border-radius:8px;background:rgba(7,6,10,0.82);font-size:10px;color:#E6E3EC}
@supports (animation-timeline: view()){@media (max-height:1600px) and (min-width:861px) and (prefers-reduced-motion: no-preference){
.proc-pin{height:360vh;view-timeline-name:--proc}
.proc-stage{position:sticky;top:0;height:100vh;display:flex;align-items:center}
.pl{width:100%;grid-template-columns:minmax(0,0.85fr) minmax(0,1.3fr);grid-template-rows:repeat(4,auto);column-gap:clamp(32px,5vw,88px);row-gap:4px;align-content:center}
.pstep{display:contents}
.ps-t{grid-column:1;padding:18px 0 18px 26px;border-left:2px solid var(--line);opacity:0.26;animation:psMid linear both;animation-timeline:--proc}
.ps-f{grid-column:2;grid-row:1 / span 4;align-self:center;border-radius:26px;opacity:0;box-shadow:0 50px 100px -40px rgba(0,0,0,0.9),0 0 0 1px rgba(255,255,255,0.08);animation:pfIn linear both;animation-timeline:--proc}
.s1 .ps-t{animation-name:psFirst;animation-range:contain 0% contain 25%}
.s1 .ps-f{opacity:1;animation:none}
.s2 .ps-t,.s2 .ps-f{animation-range:contain 25% contain 50%}
.s3 .ps-t,.s3 .ps-f{animation-range:contain 50% contain 75%}
.s4 .ps-t{animation-name:psLast;animation-range:contain 75% contain 100%}
.s4 .ps-f{animation-range:contain 75% contain 100%}
}}
@keyframes psMid{0%,100%{opacity:0.26;border-left-color:rgba(255,255,255,0.1)}14%,86%{opacity:1;border-left-color:var(--a)}}
@keyframes psFirst{0%,86%{opacity:1;border-left-color:var(--a)}100%{opacity:0.26;border-left-color:rgba(255,255,255,0.1)}}
@keyframes psLast{0%{opacity:0.26;border-left-color:rgba(255,255,255,0.1)}14%,100%{opacity:1;border-left-color:var(--a)}}
@keyframes pfIn{0%{opacity:0;transform:scale(1.06)}14%,100%{opacity:1;transform:none}}
@media (max-width:760px){.pl{grid-template-columns:minmax(0,1fr)}}

/* ---------- about ---------- */
.ab{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:clamp(32px,6vw,96px);align-items:center}
.ab-art{position:relative;margin:0;aspect-ratio:4 / 5;border-radius:28px;overflow:hidden;background:#15131C;box-shadow:0 50px 100px -40px rgba(0,0,0,0.9),0 0 0 1px rgba(255,255,255,0.08)}
.ab-art img{display:block;width:100%;height:100%;object-fit:cover;object-position:60% 50%}
@supports (animation-timeline: view()){@media (prefers-reduced-motion: no-preference){.ab-art{view-timeline-name:--abart}.ab-art img{animation:abZoom linear both;animation-timeline:--abart;animation-range:cover 0% cover 100%}}}
@keyframes abZoom{from{transform:scale(1.22) translateY(-4%)}to{transform:scale(1.04) translateY(3%)}}
.ab-art{animation:abFloat 8s ease-in-out infinite alternate}
.v2.mo .ab-art.rv-i[data-in]{animation:rvI 1.3s var(--ease) backwards,abFloat 8s ease-in-out 1.3s infinite alternate}
@keyframes abFloat{from{translate:0 0;rotate:0deg}to{translate:0 -14px;rotate:0.5deg}}
.v2.mo .ab-art[data-in] img{animation:rvImg 1.8s var(--ease) backwards}
@supports (animation-timeline: view()){@media (prefers-reduced-motion: no-preference){.v2.mo .ab-art[data-in] img{animation:rvImg 1.8s var(--ease) backwards,abZoom linear both;animation-timeline:auto,--abart;animation-range:normal,cover 0% cover 100%}}}
.ab-art figcaption{position:absolute;left:16px;bottom:16px;padding:7px 11px;border-radius:8px;background:rgba(7,6,10,0.82);font-size:10px;color:#E6E3EC}
.ab-lead{margin:28px 0 0;font-size:clamp(19px,1.6vw,23px);line-height:1.5;color:var(--ink)}
.ab-p{margin:18px 0 0;color:var(--mut)}
.kit{list-style:none;margin:32px 0 0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kit li{display:flex;flex-direction:column;gap:4px;padding:16px 18px;border-radius:16px;background:var(--glass);border:1px solid var(--line)}
.kit-n{font-weight:600;color:var(--ink)}
.kit-r{font-size:10px;color:var(--lab)}
.kit li.me{border-color:color-mix(in srgb,var(--a) 45%,transparent)}
.kit li.me .kit-r{color:var(--a)}
@media (max-width:860px){.ab{grid-template-columns:minmax(0,1fr)}.ab-art{aspect-ratio:16 / 10}}

/* ---------- faq ---------- */
.fq{display:grid;grid-template-columns:minmax(0,0.8fr) minmax(0,1.2fr);gap:clamp(32px,6vw,96px);align-items:start}
.fq-head .note{margin-top:22px}
.fq-list{display:flex;flex-direction:column;gap:10px;interpolate-size:allow-keywords}
.qa{border-radius:20px;background:var(--glass);border:1px solid var(--line);transition:border-color 0.3s,background 0.3s}
.qa:hover{background:rgba(255,255,255,0.06)}
.qa[open]{border-color:color-mix(in srgb,var(--a) 55%,transparent);background:rgba(255,255,255,0.06)}
.qa summary{display:flex;align-items:center;gap:18px;min-height:44px;padding:22px 24px;list-style:none;cursor:pointer;border-radius:20px}
.qa summary::-webkit-details-marker{display:none}
.qa summary:focus-visible{outline:2px solid var(--a);outline-offset:2px}
.qa-n{color:var(--lab)}
.qa-q{flex:1;font-weight:600;font-size:17px;color:var(--ink)}
.qa-x{position:relative;width:30px;height:30px;flex:none;border-radius:50%;border:1px solid var(--line);transition:transform 0.4s var(--ease),background 0.3s,border-color 0.3s}
.qa-x::before,.qa-x::after{content:"";position:absolute;left:50%;top:50%;width:12px;height:1.5px;margin:-0.75px 0 0 -6px;background:var(--ink)}
.qa-x::after{transform:rotate(90deg)}
.qa[open] .qa-x{transform:rotate(135deg);background:var(--a);border-color:var(--a)}
.qa[open] .qa-x::before,.qa[open] .qa-x::after{background:#07060A}
.qa::details-content{height:0;overflow:hidden;transition:height 0.45s var(--ease),content-visibility 0.45s allow-discrete}
.qa[open]::details-content{height:auto}
.qa-a{margin:0;padding:0 24px 24px 72px;color:var(--mut)}
.qa[open] .qa-a{animation:qaIn 0.6s var(--ease) both}
@keyframes qaIn{from{opacity:0;transform:translateY(-8px);filter:blur(6px)}}
@media (max-width:860px){.fq{grid-template-columns:minmax(0,1fr)}.qa-a{padding-left:24px}}

/* ---------- call to action ---------- */
.cta{text-align:center;overflow:hidden}
.cta .wrap{position:relative;z-index:2}
.cta .wrap > .lab{margin-left:auto;margin-right:auto}
.cta::before{content:"";position:absolute;left:50%;top:34%;width:min(1100px,96vw);aspect-ratio:2 / 1;translate:-50% -50%;border-radius:50%;pointer-events:none;background:radial-gradient(closest-side,color-mix(in srgb,var(--a) 15%,transparent),transparent);animation:glowPulse 6s ease-in-out infinite alternate}
@keyframes glowPulse{from{opacity:0.55;scale:0.92}to{opacity:1;scale:1.06}}
.v2.mo .qc[data-in] h3{animation:rvS 1.1s var(--ease) 0.2s backwards}
.cta-h{margin:0 auto;max-width:1280px;font-family:Anybody,sans-serif;font-stretch:125%;font-weight:900;font-size:clamp(46px,7.6vw,128px);line-height:0.9;letter-spacing:-0.035em;color:var(--ink)}
.cta-h em{letter-spacing:-0.02em}
.cta-row{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:clamp(36px,5vw,56px)}
.q2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;max-width:1040px;margin:clamp(56px,7vw,96px) auto 0;text-align:left}
.qc{display:flex;flex-direction:column;align-items:flex-start;padding:30px;border-radius:24px;background:var(--glass);border:1px solid var(--line)}
.qc .lab{margin-bottom:12px}
.qc h3{margin:0 0 10px;font-family:Anybody,sans-serif;font-stretch:120%;font-weight:800;font-size:28px;line-height:1;letter-spacing:-0.02em}
.qc .qc-d{flex:1;margin:0 0 22px;color:var(--mut);font-size:16px}
.qc .b{min-height:46px;padding:0 20px;font-size:14px}
@media (max-width:760px){.q2{grid-template-columns:minmax(0,1fr)}}

/* ---------- footer ---------- */
.foot{padding:40px 0 32px;border-top:1px solid var(--line)}
.fw{display:flex;justify-content:space-between;margin:0;font-family:Anybody,sans-serif;font-stretch:150%;font-weight:900;font-size:12.6vw;line-height:0.82;letter-spacing:-0.04em;color:transparent;-webkit-text-stroke:1.5px rgba(244,241,234,0.32);user-select:none}
.fw span{display:inline-block;transition:font-stretch 0.5s var(--ease),color 0.3s,-webkit-text-stroke-color 0.3s}
.fw span:hover{font-stretch:70%;color:var(--a);-webkit-text-stroke-color:var(--a)}
.fw span[aria-hidden]{animation:fwWave 7s ease-in-out calc(var(--k) * 0.14s) infinite}
.v2.mo .fw:not([data-in]) span[aria-hidden]{opacity:0}
.v2.mo .fw[data-in] span[aria-hidden]{animation:fwIn 1.2s var(--ease) calc(var(--k) * 70ms) backwards,fwWave 7s ease-in-out calc(1.4s + var(--k) * 0.14s) infinite}
@keyframes fwIn{from{opacity:0;transform:translateY(45%) scaleY(1.35);filter:blur(10px)}}
@keyframes fwWave{0%,100%{translate:0 0;-webkit-text-stroke-color:rgba(244,241,234,0.32)}10%{translate:0 -0.045em;-webkit-text-stroke-color:var(--a)}22%{translate:0 0;-webkit-text-stroke-color:rgba(244,241,234,0.32)}}
.frow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px;margin-top:28px;color:var(--lab)}
.flinks{display:flex;flex-wrap:wrap;gap:6px 22px}
.flinks a{display:inline-flex;align-items:center;min-height:44px;text-decoration:none;font-size:14px;color:#DCD9E2}
.flinks a:hover{color:var(--a)}

/* ---------- art viewer ---------- */
.lbx{width:min(1280px,calc(100vw - 32px));max-width:none;max-height:calc(100vh - 32px);margin:auto;padding:0;border:0;border-radius:24px;overflow:hidden;background:#0C0B10;color:var(--ink);box-shadow:0 40px 120px rgba(0,0,0,0.8)}
.lbx::backdrop{background:rgba(5,4,8,0.82);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.lbx[open]{animation:lbIn 0.35s var(--ease)}
.lbx:focus{outline:none}
@keyframes lbIn{from{opacity:0;transform:scale(0.96)}}
.lbx-img{display:block;width:100%;max-height:calc(100vh - 150px);object-fit:contain;background:#000;touch-action:pan-y;-webkit-user-select:none;user-select:none}
.lbx-img.ka{animation:lbImgA 0.7s var(--ease)}
.lbx-img.kb{animation:lbImgB 0.7s var(--ease)}
@keyframes lbImgA{from{opacity:0.2;transform:scale(1.045);filter:blur(12px)}}
@keyframes lbImgB{from{opacity:0.2;transform:scale(1.045);filter:blur(12px)}}
.lbx-order{min-height:44px;padding:0 18px;font-size:14px;margin-right:6px}
@media (max-width:620px){.lbx-btns{flex-wrap:wrap}.lbx-order{order:5;flex:1 1 100%;margin:4px 0 0}}
.lbx-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 16px;padding:16px 18px 18px}
.lbx-meta{font-size:10.5px;color:var(--lab)}
.lbx-name{margin:4px 0 0;font-family:Anybody,sans-serif;font-stretch:115%;font-weight:800;font-size:20px;line-height:1.15}
.lbx-btns{display:flex;align-items:center;gap:8px}
.lbx-pos{min-width:64px;text-align:center;font-size:10.5px;color:var(--lab)}
.lbx-b{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;margin:0;padding:0;border-radius:50%;border:1px solid var(--line);background:var(--glass);color:var(--ink);cursor:pointer;transition:border-color 0.25s,color 0.25s}
.lbx-b:hover{border-color:var(--a);color:var(--a)}
.lbx-b:focus-visible{outline:2px solid var(--a);outline-offset:2px}
.lbx-b svg{width:18px;height:18px}

/* ---------- cursor follower (mouse only) ---------- */
.cur{position:fixed;left:0;top:0;z-index:75;display:none;pointer-events:none;will-change:transform}
@media (hover:hover) and (pointer:fine){.cur{display:block}}
.cur i{position:absolute;left:-15px;top:-15px;width:30px;height:30px;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--a) 70%,transparent);transition:transform 0.35s var(--ease),opacity 0.3s,background 0.3s}
.cur b{position:absolute;left:16px;top:16px;padding:8px 12px;border-radius:999px;background:var(--a);color:#07060A;font-family:'Geist Mono',ui-monospace,monospace;font-size:10.5px;font-weight:600;line-height:1;letter-spacing:0.14em;text-transform:uppercase;white-space:nowrap;opacity:0;transform:scale(0.5);transform-origin:0 0;transition:opacity 0.25s,transform 0.4s var(--ease)}
.cur[data-m="view"] b,.cur[data-m="drag"] b{opacity:1;transform:none}
.cur[data-m="view"] b::before{content:"View"}
.cur[data-m="drag"] b::before{content:"Drag"}
.cur[data-m="zoom"] b{opacity:1;transform:none}
.cur[data-m="zoom"] b::before{content:"Hold to zoom"}
.cur[data-m="zoom"] i{transform:scale(0.35);background:var(--a)}
.cur[data-m="view"] i,.cur[data-m="drag"] i{transform:scale(0.35);background:var(--a)}
.cur[data-m="link"] i{transform:scale(1.5);background:color-mix(in srgb,var(--a) 14%,transparent)}
.cur[data-m="off"] i,.cur[data-m="off"] b,.cur:not([data-m]) i{opacity:0}

@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}.v2 *,.v2 *::before,.v2 *::after{animation:none !important;transition:none !important}}
